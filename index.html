<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/assets/ps-perfumes-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <title>PS PERFUMES | Attars, Perfumes & Luxury Fragrances from Kadapa</title>
    <meta name="description" content="Shop attars, perfumes, oud and bakhoor from PS PERFUMES, Kadapa. Glass and PVC bottle options, combo packs and cash on delivery across India." />
    <meta name="theme-color" content="#11100F" />
    <link rel="canonical" href="https://psperfumes.com/" />

    <!-- Defaults for link previews (bots that do not run JavaScript); pages override these at runtime -->
    <meta property="og:site_name" content="PS PERFUMES" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PS PERFUMES | Attars, Perfumes & Luxury Fragrances from Kadapa" />
    <meta property="og:description" content="Shop attars, perfumes, oud and bakhoor from PS PERFUMES, Kadapa. Cash on delivery across India." />
    <meta property="og:url" content="https://psperfumes.com/" />
    <meta property="og:image" content="https://psperfumes.com/assets/ps-perfumes-logo.png" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Typography: Times New Roman (system font), so no web fonts are downloaded -->

    <!-- Homepage LCP: the hero poster (public/assets, see src/services/hero.js) is preloaded only on
         "/", so it downloads alongside the scripts instead of after them. Same 768px breakpoint as
         the hero. The header logo is an inline SVG, so no logo image is preloaded. -->
    <script>
      if (location.pathname === '/') {
        [
          ['/assets/hero-poster-mobile-v1.webp', '(max-width: 768px)'],
          ['/assets/hero-poster-desktop-v1.webp', '(min-width: 769px)'],
        ].forEach(function (p) {
          var l = document.createElement('link');
          l.rel = 'preload';
          l.as = 'image';
          l.type = 'image/webp';
          l.href = p[0];
          l.media = p[1];
          l.setAttribute('fetchpriority', 'high');
          document.head.appendChild(l);
        });
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
